version: "3.9"

services:
  traefik:
    image: traefik:v2.11
    container_name: servd_traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --api.dashboard=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`${TRAEFIK_DOMAIN}`)
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.tls=true
      - traefik.http.routers.traefik.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik.service=api@internal

  app:
    build:
      context: ./app
    container_name: servd_app
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      BASE_URL: https://${APP_DOMAIN}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
    networks:
      - proxy
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.servd.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.servd.entrypoints=websecure
      - traefik.http.routers.servd.tls=true
      - traefik.http.routers.servd.tls.certresolver=letsencrypt
      - traefik.http.services.servd.loadbalancer.server.port=3000

  db:
    image: postgres:16-alpine
    container_name: servd_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  postgres_data:

networks:
  proxy:
  backend:
